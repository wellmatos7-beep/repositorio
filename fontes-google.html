<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Acesse as preferências de fontes do Google para Wellington Matos.">
  <meta name="theme-color" content="#17251f">
  <title>Fontes do Google | Wellington Matos</title>
  <style>
    :root { color-scheme: light; --deep: #17251f; --green: #243b32; --gold: #c49a5a; --paper: #f3f0e8; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 1.5rem; background: var(--paper); color: var(--deep); font-family: Arial, Helvetica, sans-serif; text-align: center; }
    main { max-width: 620px; padding: 2rem; }
    h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }
    p { line-height: 1.65; }
    .button { display: inline-flex; align-items: center; justify-content: center; margin-top: 1rem; padding: .85rem 1.2rem; border: 1px solid var(--gold); border-radius: 999px; background: var(--gold); color: var(--deep); font-weight: 700; text-decoration: none; }
    .button:hover, .button:focus-visible { background: var(--green); border-color: var(--green); color: #fff; }
    .back { display: inline-block; margin-top: 1.25rem; color: var(--green); }
  </style>
</head>
<body>
  <main>
    <h1>Fontes do Google</h1>
    <p>Consulte as preferências de fontes do Google para o site Wellington Matos.</p>
    <a class="button" href="https://www.google.com/preferences/source?q=https://wellingtonmatos.com.br/" target="_blank" rel="noopener noreferrer">Ver fontes no Google ↗</a>
    <br>
    <a class="back" href="index.html">Voltar ao site</a>
  </main>
</body>
</html>
