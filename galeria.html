<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Galeria de fotos de Wellington Matos, de suas pesquisas e publicações.">
  <meta name="theme-color" content="#17251f">
  <title>Galeria de fotos | Wellington Matos</title>
  <style>
    :root { color-scheme: light; --green: #243b32; --gold: #c49a5a; --paper: #f3f0e8; --ink: #202720; --muted: #667067; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    header { padding: 48px 24px; background: var(--green); color: #f8f5ec; border-bottom: 5px solid var(--gold); }
    header > div, main { width: min(1120px, 100% - 32px); margin: auto; }
    a { color: inherit; }
    header a { color: #e5c995; }
    h1, h2, figcaption { font-family: Georgia, "Times New Roman", serif; font-weight: 400; }
    h1 { margin: 18px 0 10px; font-size: clamp(36px, 6vw, 58px); }
    header p { max-width: 650px; line-height: 1.7; color: #d4ddd5; }
    main { padding: 36px 0 64px; }
    section { margin: 0 0 48px; }
    h2 { margin: 0 0 18px; font-size: 30px; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
    figure { margin: 0; overflow: hidden; background: #fffdf8; border: 1px solid #d8d3c7; box-shadow: 0 10px 24px rgba(24, 34, 27, .08); }
    figure img { display: block; width: 100%; height: 280px; object-fit: cover; background: #e3ded1; }
    figcaption { padding: 14px 16px; font-size: 18px; }
    .books img { height: 330px; object-fit: contain; padding: 12px; }
    .back { display: inline-block; margin-top: 10px; padding: 12px 16px; background: var(--green); color: white; text-decoration: none; }
    footer { padding: 24px; background: #111b15; color: #d4ddd5; text-align: center; font-size: 13px; }
    @media (max-width: 560px) { header { padding: 34px 0; } figure img { height: 250px; } .books img { height: 300px; } }
  </style>
</head>
<body>
  <header><div>
    <a href="index.html">← Voltar ao site</a>
    <h1>Galeria de fotos</h1>
    <p>Registros de Wellington Matos, da pesquisa sobre a Segunda Guerra Mundial no Maranhão e das publicações do autor.</p>
  </div></header>
  <main>
    <section aria-labelledby="pessoas">
      <h2 id="pessoas">Wellington Matos</h2>
      <div class="gallery">
        <figure><img src="Imagens%20e%20Fotos/WellingtonMatos.Foto1.png.jpg" alt="Wellington Matos — foto 1" loading="lazy"><figcaption>Wellington Matos</figcaption></figure>
        <figure><img src="Imagens%20e%20Fotos/WellingtonMatos.Foto2.png.png" alt="Wellington Matos — foto 2" loading="lazy"><figcaption>Wellington Matos</figcaption></figure>
        <figure><img src="Imagens%20e%20Fotos/WellingtonMatos.Foto4.png.png" alt="Wellington Matos — foto 4" loading="lazy"><figcaption>Wellington Matos</figcaption></figure>
        <figure><img src="Imagens%20e%20Fotos/WellingtonMatos.Foto5.png.png" alt="Wellington Matos — foto 5" loading="lazy"><figcaption>Wellington Matos</figcaption></figure>
        <figure><img src="Imagens%20e%20Fotos/WellingtonMatos.Foto6.png.jpg" alt="Wellington Matos — foto 6" loading="lazy"><figcaption>Wellington Matos</figcaption></figure>
      </div>
    </section>
    <section aria-labelledby="pesquisa">
      <h2 id="pesquisa">Pesquisa e território</h2>
      <div class="gallery">
        <figure><img src="Imagens%20e%20Fotos/humberto_de_campos_sage_20260509_233803.png" alt="Registro relacionado à pesquisa em Humberto de Campos, Maranhão" loading="lazy"><figcaption>Humberto de Campos · Maranhão</figcaption></figure>
      </div>
    </section>
    <section class="books" aria-labelledby="livros">
      <h2 id="livros">Livros e publicações</h2>
      <div class="gallery">
        <figure><img src="LivroWellingtonMatos_Foto1.jpg" alt="Livro de Wellington Matos — foto 1" loading="lazy"><figcaption>Publicação de Wellington Matos</figcaption></figure>
        <figure><img src="LivroWellingtonMatos_Foto2.png" alt="Livro de Wellington Matos — foto 2" loading="lazy"><figcaption>Publicação de Wellington Matos</figcaption></figure>
        <figure><img src="LivroWellingtonMatos_Foto3.jpg" alt="Livro de Wellington Matos — foto 3" loading="lazy"><figcaption>Publicação de Wellington Matos</figcaption></figure>
        <figure><img src="LivroWellingtonMatos_Foto4%20-%20Copia.jpg" alt="Livro de Wellington Matos — foto 4" loading="lazy"><figcaption>Publicação de Wellington Matos</figcaption></figure>
        <figure><img src="LivroWellingtonMatos_Foto6%20-%20Copia.png" alt="Livro de Wellington Matos — foto 6" loading="lazy"><figcaption>Publicação de Wellington Matos</figcaption></figure>
        <figure><img src="LivroWellingtonMatos_Foto7%20-%20Copia.png" alt="Livro de Wellington Matos — foto 7" loading="lazy"><figcaption>Publicação de Wellington Matos</figcaption></figure>
      </div>
    </section>
    <a class="back" href="index.html">Voltar à página inicial</a>
  </main>
  <footer>Wellington Matos · História · Pesquisa · Literatura</footer>
</body>
</html>
